<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="42" font-size="30" font-weight="bold" text-anchor="middle">MIDI IN: jack → 6N137 → ESP32-S3 GPIO 18</text>

  <!-- MIDI jack, front view, "smiley" arc: 1 = leftmost, 5 = rightmost -->
  <circle cx="200" cy="330" r="130" fill="#f2f2f2" stroke="#333" stroke-width="4"/>
  <rect x="185" y="190" width="30" height="22" fill="#fff" stroke="#333" stroke-width="3"/>
  <text x="200" y="490" font-size="22" text-anchor="middle" font-weight="bold">MIDI JACK</text>
  <text x="200" y="516" font-size="17" text-anchor="middle" fill="#555">pins: 1 = leftmost … 5 = rightmost</text>
  <!-- pins on a smile arc -->
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <circle cx="112" cy="315" r="13" fill="#bbb" stroke="#333" stroke-width="2"/><text x="112" y="297">1</text>
    <circle cx="146" cy="370" r="13" fill="#1f77b4" stroke="#333" stroke-width="2"/><text x="120" y="385">2</text>
    <circle cx="200" cy="392" r="13" fill="#bbb" stroke="#333" stroke-width="2"/><text x="200" y="430">3</text>
    <circle cx="254" cy="370" r="13" fill="#d62728" stroke="#333" stroke-width="2"/><text x="280" y="385">4</text>
    <circle cx="288" cy="315" r="13" fill="#bbb" stroke="#333" stroke-width="2"/><text x="288" y="297">5</text>
  </g>
  <text x="200" y="560" font-size="17" text-anchor="middle" fill="#555">1, 3, 5 = NOT connected</text>

  <!-- 6N137 chip, top view -->
  <rect x="520" y="200" width="160" height="300" rx="10" fill="#222"/>
  <circle cx="545" cy="225" r="9" fill="#fff"/>
  <text x="600" y="355" font-size="24" fill="#fff" text-anchor="middle" font-weight="bold">6N137</text>
  <text x="600" y="382" font-size="15" fill="#ccc" text-anchor="middle">top view</text>
  <text x="600" y="530" font-size="16" text-anchor="middle" fill="#555">dot = pin 1 · chip across the breadboard gap</text>
  <!-- left pins 1..4 -->
  <g font-size="20" font-weight="bold">
    <line x1="490" y1="240" x2="520" y2="240" stroke="#666" stroke-width="8"/><text x="532" y="247" fill="#fff">1</text>
    <line x1="490" y1="310" x2="520" y2="310" stroke="#666" stroke-width="8"/><text x="532" y="317" fill="#fff">2</text>
    <line x1="490" y1="380" x2="520" y2="380" stroke="#666" stroke-width="8"/><text x="532" y="387" fill="#fff">3</text>
    <line x1="490" y1="450" x2="520" y2="450" stroke="#666" stroke-width="8"/><text x="532" y="457" fill="#fff">4</text>
    <!-- right pins 8..5 -->
    <line x1="680" y1="240" x2="710" y2="240" stroke="#666" stroke-width="8"/><text x="656" y="247" fill="#fff">8</text>
    <line x1="680" y1="310" x2="710" y2="310" stroke="#666" stroke-width="8"/><text x="656" y="317" fill="#fff">7</text>
    <line x1="680" y1="380" x2="710" y2="380" stroke="#666" stroke-width="8"/><text x="656" y="387" fill="#fff">6</text>
    <line x1="680" y1="450" x2="710" y2="450" stroke="#666" stroke-width="8"/><text x="656" y="457" fill="#fff">5</text>
  </g>
  <text x="470" y="245" font-size="17" text-anchor="end" fill="#555">nothing</text>
  <text x="470" y="455" font-size="17" text-anchor="end" fill="#555">nothing</text>

  <!-- jack pad 4 -> 220R -> chip pin 2 (red), BENCH-PROVEN 2026-09-29 -->
  <path d="M254 370 L254 470 L330 470 L330 310 L370 310" fill="none" stroke="#d62728" stroke-width="5"/>
  <rect x="370" y="296" width="70" height="28" fill="#fff" stroke="#d62728" stroke-width="4"/>
  <text x="405" y="316" font-size="17" text-anchor="middle" font-weight="bold">220 Ω</text>
  <line x1="440" y1="310" x2="490" y2="310" stroke="#d62728" stroke-width="5"/>
  <!-- jack pad 2 -> chip pin 3 (blue) -->
  <path d="M146 370 L146 440 L360 440 L360 380 L490 380" fill="none" stroke="#1f77b4" stroke-width="5"/>

  <!-- right side -->
  <!-- pin 8 -> 5V -->
  <line x1="710" y1="240" x2="900" y2="240" stroke="#d62728" stroke-width="5"/>
  <text x="910" y="247" font-size="22" font-weight="bold" fill="#d62728">5 V</text>
  <!-- pin 7 -> 5V -->
  <line x1="710" y1="310" x2="780" y2="310" stroke="#d62728" stroke-width="5"/>
  <line x1="780" y1="310" x2="780" y2="240" stroke="#d62728" stroke-width="5"/>
  <circle cx="780" cy="240" r="6" fill="#d62728"/>
  <!-- pin 6 -> GPIO 18, 1k to 3.3V -->
  <line x1="710" y1="380" x2="900" y2="380" stroke="#2ca02c" stroke-width="5"/>
  <text x="910" y="388" font-size="22" font-weight="bold" fill="#2ca02c">GPIO 18</text>
  <circle cx="840" cy="380" r="6" fill="#2ca02c"/>
  <line x1="840" y1="380" x2="840" y2="345" stroke="#2ca02c" stroke-width="5"/>
  <rect x="826" y="285" width="28" height="60" fill="#fff" stroke="#ff7f0e" stroke-width="4"/>
  <text x="866" y="322" font-size="17" font-weight="bold">1 kΩ</text>
  <line x1="840" y1="285" x2="840" y2="270" stroke="#ff7f0e" stroke-width="5"/>
  <line x1="840" y1="270" x2="900" y2="270" stroke="#ff7f0e" stroke-width="5"/>
  <text x="910" y="277" font-size="22" font-weight="bold" fill="#ff7f0e">3.3 V</text>
  <!-- pin 5 -> GND -->
  <line x1="710" y1="450" x2="900" y2="450" stroke="#000" stroke-width="5"/>
  <text x="910" y="458" font-size="22" font-weight="bold">GND (S3 GND)</text>
  <!-- 100nF between 8 and 5 -->
  <line x1="740" y1="240" x2="740" y2="330" stroke="#9467bd" stroke-width="3" stroke-dasharray="0"/>
  <circle cx="740" cy="240" r="5" fill="#9467bd"/>
  <line x1="725" y1="330" x2="755" y2="330" stroke="#9467bd" stroke-width="4"/>
  <line x1="725" y1="340" x2="755" y2="340" stroke="#9467bd" stroke-width="4"/>
  <line x1="740" y1="340" x2="740" y2="450" stroke="#9467bd" stroke-width="3"/>
  <circle cx="740" cy="450" r="5" fill="#9467bd"/>
  <text x="700" y="345" font-size="15" fill="#9467bd" text-anchor="end" font-weight="bold"> </text>
  <text x="760" y="425" font-size="15" fill="#9467bd" font-weight="bold">100 nF (pin 8 ↔ pin 5)</text>

  <!-- notes -->
  <g font-size="19">
    <text x="60" y="620">• 3.3 V must NOT be 5 V. GPIO 18 wire must read 3.3 V with the keyboard unplugged.</text>
    <text x="60" y="650">• Bench-proven with an Arturia KeyStep: pad 4 → 220 Ω → chip 2, pad 2 → chip 3 (front-view numbering).</text>
    <text x="60" y="680">• Diode: leave it out for now. Keyboard cable goes into the keyboard's MIDI OUT.</text>
  </g>
</svg>
