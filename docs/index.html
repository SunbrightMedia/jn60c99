<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🎹</text></svg>">
<title>jn60c99 — JUNO-60 C99 (in-browser)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #1a1c20; color: #ddd; }
  header { position: sticky; top: 0; background: #23262c; border-bottom: 1px solid #333;
           padding: 8px 12px; z-index: 10; }
  h1 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select, input[type=text], input[type=number] {
    background: #2c2f36; color: #ddd; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: inherit; }
  button { cursor: pointer; } button:hover { background: #363a42; }
  button.on { background: #3a5; border-color: #4c7; color: #fff; }
  .warn { color: #e88; font-size: 12px; margin-top: 4px; }   /* real errors only */
  .info { color: #9ad39a; font-size: 12px; margin-top: 4px; }  /* status / it-works */
  .caveat { color: #7d8894; font-size: 11px; margin-top: 3px; line-height: 1.4; }
  .note { color: #888; font-size: 11px; font-weight: 400; }
  main { padding: 10px 12px 80px; }
  .sec { margin: 14px 0 4px; font-weight: 600; color: #9cf; border-bottom: 1px solid #333;
         padding-bottom: 2px; }
  .p { display: grid; grid-template-columns: 220px 1fr 90px 20px; gap: 8px;
       align-items: center; padding: 2px 0; }
  .p label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p .off { color: #667; font-size: 11px; }
  .p input[type=range] { width: 100%; }
  .p input[type=number] { width: 88px; }
  #piano { position: relative; height: 90px; user-select: none; margin: 6px 0; }
  .key { position: absolute; bottom: 0; border: 1px solid #111; border-radius: 0 0 4px 4px; }
  .key.w { width: 26px; height: 90px; background: #eee; z-index: 1; }
  .key.b { width: 16px; height: 56px; background: #222; z-index: 2; }
  .key.w.dn { background: #9cf; } .key.b.dn { background: #47a; }
  #status { position: fixed; bottom: 0; left: 0; right: 0; background: #23262c;
            border-top: 1px solid #333; padding: 5px 12px; font-size: 12px; color: #9a9; }
</style>

<header>
  <h1>jn60c99 — JUNO-60 C99 <span class=note id="meta">· loading WebAssembly…</span></h1>
  <div class="row">
    <button onclick="factory()">Factory patch</button>
    <select id="presets" title="saved patches (this browser)"></select>
    <button onclick="loadPreset()">Load</button>
    <button onclick="savePreset()">Save…</button>
    <button onclick="exportPreset()" title="download current patch as .json">Export</button>
    <button onclick="document.getElementById('imp').click()">Import</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importPreset(this)">
    <span style="width:12px"></span>
    <button onclick="render()" title="play a middle-C note of the current patch (dry voice path)">▶ Audition (C4)</button>
    <span style="width:12px"></span>
    <button onclick="document.getElementById('bankfile').click()" title="load a KoaBankFile00003 / PG-JU60 bank">Load bank (.bin)…</button>
    <input type="file" id="bankfile" accept=".bin" style="display:none" onchange="loadBank(this)">
  </div>
  <div id="piano"></div>
  <div class="row" id="arpbar" style="align-items:center;gap:8px">
    <b>Arp</b>
    <button id="arpToggle" onclick="arpToggle()" title="hold keys/chords to arpeggiate them">Off</button>
    <label>Mode
      <select id="arpMode" onchange="arpApply()">
        <option value="0">Up</option><option value="1">Down</option><option value="2">Up&amp;Down</option>
      </select></label>
    <label>Octaves
      <select id="arpOct" onchange="arpApply()"><option>1</option><option>2</option><option>3</option></select></label>
    <label>Tempo
      <input type="range" id="arpRate" min="40" max="260" step="1" value="120" oninput="arpApply()" style="vertical-align:middle">
      <span id="arpRateV">120 BPM</span></label>
    <label>Gate
      <input type="range" id="arpGate" min="0" max="1" step="0.05" value="0.6" oninput="arpApply()" style="vertical-align:middle">
      <span id="arpGateV">60%</span></label>
  </div>
  <div class="row">
    <input type="text" id="filter" placeholder="filter parameters…" oninput="renderList()" style="flex:1">
  </div>
  <div class="warn" id="warn"></div>
</header>

<dialog id="bankdlg" style="width:min(760px,92vw);max-height:82vh;background:#22252b;color:#ddd;border:1px solid #444;border-radius:8px;padding:0">
  <div style="position:sticky;top:0;background:#262a31;padding:8px 12px;border-bottom:1px solid #383c44;display:flex;gap:8px;align-items:center">
    <b id="bankttl">Bank</b>
    <select id="banksel" style="flex:1"></select>
    <button class="on" onclick="applyBankPatch()" title="load this patch's bit-exact coefficient subset into the engine">Apply to engine ▶</button>
    <button onclick="document.getElementById('bankdlg').close()">Close</button>
  </div>
  <div style="padding:6px 12px 4px" id="bankwarn"></div>
  <div id="bankparams" style="padding:4px 12px 14px"></div>
</dialog>

<main id="list"></main>
<div id="status">initialising…</div>

<script type="module">
import { decodeBank } from "./bank.js";

/* Cache-buster: build.sh rewrites this to the WASM content hash each build, so a new
 * engine is always fetched fresh instead of served from the browser/CDN cache. */
const BUILD_VER = "baee00ed9a7a";

const SR = 96000;
const $ = s => document.querySelector(s);
const status = m => $("#status").textContent = m;

// heuristics mirrored from gui/juno_web.py param_meta()
const SWITCH = /\b(sw|on\/?off|onoff|mute|enable|bypass|sync|reset|trig|initialize|use iir|tap sw|low cut sw|high cut sw)\b/i;
const BIPOLAR = /\b(tune|detune|bend|offset|ofst|phase|pan)\b/i;
function sectionOf(off) {
  const t = [[84000,"Voice"],[85000,"Master/Voices"],[91000,"Drive/OD/DS"],
    [96000,"FX Chorus A (91k)"],[101000,"FX Chorus B (96k)"],[102000,"Output"],
    [110000,"Delay/HighCut"],[5000000,"Delay 2"],[6400000,"Chorus I"],
    [6450000,"Flanger"],[6500000,"FX"],[10700000,"Chorus II"]];
  for (const [lim,name] of t) if (off < lim) return name;
  return "Reverb Ecf";
}

let M, ctx, get, set, factoryFn, chorusFn, gateFn, renderFn, malloc, free;
let noteOnFn, noteOffFn, applyBankFn, renderDryFn, arpFn, getArpFn;
let arpOn = false;
let PARAMS = [], REAL = {};

async function boot() {
  status("loading engine (build " + BUILD_VER + ")…");
  const { default: JunoModule } = await import("./juno.js?v=" + BUILD_VER);
  M = await JunoModule({ locateFile: (path) => path.endsWith(".wasm") ? path + "?v=" + BUILD_VER : path });
  get = M.cwrap("juno_gui_get","number",["number","number"]);
  set = M.cwrap("juno_gui_set",null,["number","number","number"]);
  factoryFn = M.cwrap("juno_gui_recall_factory",null,["number"]);
  chorusFn = M.cwrap("juno_gui_set_chorus_mode",null,["number","number"]);
  gateFn = M.cwrap("juno_gui_gate",null,["number","number"]);
  renderFn = M.cwrap("juno_gui_render","number",["number","number","number"]);
  renderDryFn = M.cwrap("juno_gui_render_dry","number",["number","number","number"]);
  noteOnFn = M.cwrap("juno_gui_note_on",null,["number","number","number"]);
  noteOffFn = M.cwrap("juno_gui_note_off",null,["number","number"]);
  arpFn = M.cwrap("juno_gui_arp_config",null,["number","number","number","number","number","number"]);
  getArpFn = M.cwrap("juno_gui_get_arp","number",["number"]);
  applyBankFn = M.cwrap("juno_gui_apply_bank","number",["number","number","number","number"]);
  malloc = M._malloc; free = M._free;
  ctx = M.cwrap("juno_gui_create","number",["number","number"])(SR, 2);  // chorus mode II
  if (!ctx) { status("engine alloc failed"); return; }

  const raw = await fetch("params.json").then(r => r.json());
  try { REAL = await fetch("param_meta.json").then(r => r.ok ? r.json() : {}); } catch { REAL = {}; }
  PARAMS = raw.map(([off,name]) => descriptor(off,name));

  $("#meta").textContent = `· ${PARAMS.length} params @ ${SR} Hz · build ${BUILD_VER} · runs entirely in your browser`;
  $("#warn").innerHTML =
    `<div class="info">✓ Ready — <b>Load bank → Apply → press a key.</b> Applying a patch loads <b>49 patch parameters as bit-exact coefficients</b> — every DSP coefficient the plugin's recall writes, proven two independent ways (golden coefficient bits + full-instance Unicorn emulation): oscillator mix, VCF+HPF, both ADSR envelopes, VCA (incl. mode + velocity sens), LFO (incl. env-trigger), portamento, bend, and per-patch delay · reverb · arpeggiator. You hear the <b>full signal path</b> — voice + stereo BBD chorus + output stage — at the plugin's own level.</div>` +
    `<div class="caveat">Caveats (not defects): the per-patch <b>DELAY</b> and <b>REVERB</b> effects are now recalled from the plugin's own value-tree (delay type/level/time/feedback; reverb level + time), so delay patches echo and each patch gets its own reverb amount; chorus is complete (the JU-06A runs one chorus, correct for all patches). The note-on trigger is now a <b>bit-exact transcription of the plugin's own note handler</b> — M.CV (pitch) and M.Gate are written immediately, matching the plugin's parameter descriptors, so attacks are snappy with no onset click. The <b>arpeggiator</b> (row above the parameter list) is a <b>bit-exact transcription of the plugin's CArpeggio</b> (src/carp.c): the note ordering (UP / UP&amp;DOWN / DOWN selectors), the pitch-sorted held-note list, the octave fold across 1-3 octaves, the velocity math and the 24-PPQN tempo clock with its gate table are all copied field-for-field from the binary. It <b>auto-recalls per preset</b>: the arp on/mode/octave-range are decoded from the patch record (verified — all 7 factory "SQ" arp presets enable with the correct pattern), so arp presets arpeggiate on load. Tempo (BPM) and gate stay local, because the plugin's arp is host-tempo-synced — those are host inputs, not per-patch values. The sliders below show the engine's live coefficient values.</div>`;
  buildPiano();
  refreshPresets();
  renderList();
  status("ready — running in-browser (no server)");
}

function descriptor(off, name) {
  const val = get(ctx, off);
  let lo, hi, kind, auth = false;
  if (REAL[off]) { lo = +REAL[off].min; hi = +REAL[off].max; kind = REAL[off].kind || "cont"; auth = true; }
  else if (SWITCH.test(name)) { lo = 0; hi = 1; kind = "switch"; }
  else if (BIPOLAR.test(name)) { const s = Math.max(1, Math.abs(val)*1.25); lo = -s; hi = s; kind = "cont"; }
  else { lo = 0; hi = Math.max(1, Math.abs(val)*1.25); kind = "cont"; }
  return { off, name, section: sectionOf(off), kind, min: lo, max: hi, value: val, auth };
}

const fmt = v => v === 0 ? "0" : (Math.abs(v) >= 1e-4 && Math.abs(v) < 1e6 ? (+v.toFixed(6)).toString() : v.toExponential(3));
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

function renderList() {
  const f = $("#filter").value.toLowerCase();
  const el = $("#list"); el.innerHTML = ""; let sec = null;
  for (const p of PARAMS) {
    if (f && !p.name.toLowerCase().includes(f) && !String(p.off).includes(f)) continue;
    if (p.section !== sec) { sec = p.section; const h = document.createElement("div"); h.className="sec"; h.textContent=sec; el.appendChild(h); }
    el.appendChild(rowFor(p));
  }
}

function rowFor(p) {
  const d = document.createElement("div"); d.className = "p";
  const lab = document.createElement("label"); lab.title = p.name;
  lab.innerHTML = `<span class=off>@${p.off} </span>${p.name}`;
  const mid = document.createElement("div");
  const num = document.createElement("input"); num.type="number"; num.step="any"; num.value=fmt(p.value);

  if (p.kind === "switch") {
    const b = document.createElement("button");
    const paint = v => { b.textContent = v>=0.5?"ON":"off"; b.classList.toggle("on", v>=0.5); };
    paint(p.value);
    b.onclick = () => commit(p, b.classList.contains("on")?0:1, {num, paint});
    num.style.display = "none"; mid.appendChild(b);
  } else {
    const r = document.createElement("input"); r.type="range";
    r.min=p.min; r.max=p.max; r.step=(p.max-p.min)/1000 || 0.001; r.value=clamp(p.value,p.min,p.max);
    r.oninput = () => num.value = fmt(+r.value);
    r.onchange = () => commit(p, +r.value, {num, range:r});
    mid.appendChild(r); p._range = r;
  }
  num.onchange = () => commit(p, +num.value, {num, range:p._range});
  d.append(lab, mid, num); return d;
}

function commit(p, v, ui) {
  set(ctx, p.off, v); p.value = get(ctx, p.off);
  if (ui.num) ui.num.value = fmt(p.value);
  if (ui.range) ui.range.value = clamp(p.value, p.min, p.max);
  if (ui.paint) ui.paint(p.value);
  status(`${p.name} @${p.off} = ${fmt(p.value)}`);
}

// --- controls (exposed for inline handlers) ---
window.renderList = renderList;
window.factory = () => { factoryFn(ctx); PARAMS.forEach(p => p.value = get(ctx,p.off)); renderList(); status("factory patch recalled"); };
window.chorus = m => { chorusFn(ctx, m); document.querySelectorAll(".cm").forEach(b=>b.classList.toggle("on", +b.dataset.m===m)); status("chorus mode "+m); };
window.arpApply = () => {
  const mode=+$("#arpMode").value, oct=+$("#arpOct").value,
        bpm=+$("#arpRate").value, gate=+$("#arpGate").value;
  $("#arpRateV").textContent = bpm+" BPM";
  $("#arpGateV").textContent = Math.round(gate*100)+"%";
  if (arpFn) arpFn(ctx, arpOn?1:0, mode, oct, bpm, gate);
  if (arpOn) status(`arp on — hold keys/chords to arpeggiate (${["up","down","up&down"][mode]}, ${oct} oct, ${bpm} BPM, eighth-notes)`);
};
window.arpToggle = () => {
  arpOn = !arpOn;
  const b=$("#arpToggle"); b.textContent = arpOn?"On":"Off"; b.classList.toggle("on", arpOn);
  if (arpOn) ensureAudio();
  arpApply();
};

// --- presets: localStorage + file export/import ---
const KEY = "jn60c99.presets";
const store = () => JSON.parse(localStorage.getItem(KEY) || "{}");
function refreshPresets() {
  const s = $("#presets"), names = Object.keys(store()).sort();
  s.innerHTML = names.map(n=>`<option>${n}</option>`).join("") || "<option disabled>(no saved patches)</option>";
}
function snapshot() { const o={}; for (const p of PARAMS) o[p.off]=get(ctx,p.off); return o; }
function apply(o) { for (const k in o) set(ctx, +k, +o[k]); PARAMS.forEach(p=>p.value=get(ctx,p.off)); renderList(); }
window.savePreset = () => { const n=prompt("Patch name:"); if(!n) return; const all=store(); all[n]=snapshot(); localStorage.setItem(KEY, JSON.stringify(all)); refreshPresets(); $("#presets").value=n; status("saved "+n); };
window.loadPreset = () => { const n=$("#presets").value, all=store(); if(!all[n]) return; apply(all[n]); status("loaded "+n); };
window.exportPreset = () => { const blob=new Blob([JSON.stringify(snapshot(),null,0)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="patch.json"; a.click(); status("exported patch.json"); };
window.importPreset = (inp) => { const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ apply(JSON.parse(rd.result)); status("imported "+f.name);}catch(e){status("import failed: "+e);} }; rd.readAsText(f); inp.value=""; };

// --- render + play via Web Audio (no server), REAL-TIME + POLYPHONIC ---
// A ScriptProcessor renders the full 8-voice master path continuously; key
// presses drive per-voice note-on/off through the ported gate/ADSR driver and
// the 8-voice allocator (juno_bridge.c), so held chords sound with real voices.
let audioCtx, procNode, rbuf = 0, rcap = 0;
const BLK = 1024;
function ensureAudio() {
  if (audioCtx) { audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate: SR});
  // The engine's coefficients are computed for EXACTLY 96 kHz. Many browsers/devices
  // won't honor a 96 kHz context and silently fall back (usually 48 kHz). Playing
  // 96 kHz samples at that rate is the classic "octave-low, half-speed, sounds wrong".
  // Instead we keep the engine bit-exact at 96 kHz and RESAMPLE its stereo output to
  // whatever rate the context actually provides (linear interpolation via a bounded
  // FIFO). ratio = engine samples consumed per output sample.
  const outRate = audioCtx.sampleRate;
  const ratio = SR / outRate;                  // 1.0 when the 96 kHz request is honored
  const resampling = Math.abs(ratio - 1) > 1e-6;
  if (resampling) {
    status("audio at " + outRate + " Hz; engine runs at 96 kHz and is resampled to match "
           + "(pitch & tempo correct).");
    console.warn("JUNO: resampling 96000 ->", outRate, "ratio", ratio.toFixed(4));
  }
  // engine scratch large enough for one output block's worth of engine samples + slack
  const ENGCAP = Math.ceil(BLK * Math.max(ratio, 1)) + 8;
  rbuf = malloc(ENGCAP * 2 * 4); rcap = ENGCAP;
  // resample FIFO (interleaved L,R engine samples not yet consumed) + fractional read ptr
  let fifo = new Float32Array(0), fifoN = 0, readPtr = 0.0;
  const clamp1 = (x) => x > 1 ? 1 : x < -1 ? -1 : x;
  procNode = audioCtx.createScriptProcessor(BLK, 0, 2);
  procNode.onaudioprocess = (e) => {
    const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
    const n = L.length;                        // == BLK, at outRate
    if (!resampling) {                         // 96 kHz honored: 1:1, no resample
      renderFn(ctx, rbuf, n);
      const s = new Float32Array(M.HEAPF32.buffer, rbuf, n * 2);
      for (let i = 0; i < n; i++) { L[i] = clamp1(s[2*i]); R[i] = clamp1(s[2*i+1]); }
      return;
    }
    // need engine frames up to index ceil(readPtr + (n-1)*ratio) + 1
    const needIdx = Math.ceil(readPtr + (n - 1) * ratio) + 1;
    if (fifoN < needIdx + 1) {                 // render more engine frames into the FIFO
      let produce = (needIdx + 1) - fifoN;
      const grown = new Float32Array((fifoN + produce) * 2);
      grown.set(fifo.subarray(0, fifoN * 2), 0);
      let dst = fifoN;
      while (produce > 0) {
        const chunk = Math.min(produce, ENGCAP);
        renderFn(ctx, rbuf, chunk);            // advances the engine stream
        const s = new Float32Array(M.HEAPF32.buffer, rbuf, chunk * 2);
        grown.set(s, dst * 2);
        dst += chunk; produce -= chunk;
      }
      fifo = grown; fifoN = needIdx + 1;
    }
    for (let i = 0; i < n; i++) {               // linear-interpolate the engine stream
      const p = readPtr + i * ratio, j = Math.floor(p), fr = p - j;
      L[i] = clamp1(fifo[2*j]   + (fifo[2*(j+1)]   - fifo[2*j])   * fr);
      R[i] = clamp1(fifo[2*j+1] + (fifo[2*(j+1)+1] - fifo[2*j+1]) * fr);
    }
    readPtr += n * ratio;                        // advance, then drop consumed frames
    const drop = Math.floor(readPtr);
    if (drop > 0) {
      fifo = fifo.slice(drop * 2); fifoN -= drop; readPtr -= drop;
    }
  };
  procNode.connect(audioCtx.destination);
}
// "Audition" = play a middle-C (C4) for ~0.6s (note-on then note-off).
window.render = () => { note(60, true); setTimeout(() => note(60, false), 600); };

// --- bank browser (.bin) ---
let BANK = null, BANK_RAW = null;
window.loadBank = (inp) => {
  const f = inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      BANK_RAW = new Uint8Array(rd.result);           // raw bytes for the C applier
      BANK = decodeBank(rd.result); showBank();
      status(`bank loaded: ${BANK.patch_count} patches`);
    }
    catch (e) { status("bank error: " + e.message); alert("Could not read bank:\n" + e.message); }
  };
  rd.readAsArrayBuffer(f); inp.value = "";
};

// Apply the selected patch's bit-exact coefficient subset into the live engine.
window.applyBankPatch = () => {
  if (!BANK_RAW) return;
  const idx = +$("#banksel").value;
  const ptr = malloc(BANK_RAW.length);
  M.HEAPU8.set(BANK_RAW, ptr);
  const n = applyBankFn(ctx, ptr, BANK_RAW.length, idx);
  free(ptr);
  PARAMS.forEach(p => p.value = get(ctx, p.off));   // reflect new coeffs in the sliders
  renderList();
  // sync the arp UI to the per-patch arp recall (juno_gui_apply_bank set it)
  if (getArpFn) {
    const a = getArpFn(ctx);
    arpOn = !!(a & 1);
    $("#arpMode").value = String((a >> 1) & 3);
    $("#arpOct").value  = String(((a >> 3) & 3) + 1);
    const b = $("#arpToggle"); b.textContent = arpOn ? "On" : "Off"; b.classList.toggle("on", arpOn);
  }
  $("#bankdlg").close();
  status(`applied patch ${idx} "${BANK.patches[idx].name}" — ${n} bit-exact coefficients loaded${arpOn?" · arp ON":""} (press a key to hear it)`);
};
function showBank() {
  const sel = $("#banksel");
  sel.innerHTML = BANK.patches.map(p => `<option value="${p.index}">${String(p.index).padStart(2,"0")}  ${p.name}</option>`).join("");
  sel.onchange = () => showPatch(+sel.value);
  $("#bankttl").textContent = `${BANK.model} bank`;
  $("#bankwarn").innerHTML =
    `<div class="info"><b>Apply to engine</b> loads <b>49 patch parameters as bit-exact coefficients</b> — every DSP coefficient the plugin's own recall writes, confirmed two independent ways (golden coefficient bits + a full-instance Unicorn emulation of the plugin's ctor + dispatch): DCO range / PWM depth·level·source / saw·sub·noise level / LFO mod, VCF cutoff · resonance · HPF cutoff+type · env-mod · key-follow · LFO mod, both ADSR envelopes in full, VCA tone · level · mode, LFO delay · rate · key-trig · tempo-sync · env-trig, portamento · bend range, velocity sensitivity, and per-patch delay · reverb · arpeggiator.</div>` +
    `<div class="caveat">Bit-exact for every recalled DSP coefficient. The remaining JUNO panel controls are <b>not per-patch DSP coefficients</b>: bend / mod-wheel sensitivity (inert unless you move those controls), note-assign modes (mono / legato — this preview plays polyphonic), and the JU-06A-only controls the JUNO-60 disables (2nd oscillator, ring, sync). Chorus is exact for 55/64 patches; 9 use effect modes that route to an un-decompiled FX block (kept at chorus). See docs/RECALL_COMPLETE.md.</div>`;
  showPatch(0);
  $("#bankdlg").showModal();
}
function showPatch(idx) {
  const p = BANK.patches[idx];
  const rows = p.params.map(pr => {
    const bar = Math.round(pr.normalized * 100);
    const dim = pr.confidence === "unconfirmed" ? "opacity:.55" : "";
    return `<div style="display:grid;grid-template-columns:210px 1fr 54px;gap:8px;align-items:center;padding:1px 0;${dim}">
      <span title="${pr.role}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pr.role}</span>
      <span style="background:#1a1c20;border-radius:3px;height:9px;position:relative"><span style="position:absolute;left:0;top:0;bottom:0;width:${bar}%;background:#4a7;border-radius:3px"></span></span>
      <span style="text-align:right;color:#9cf">${pr.raw} <span class=note>(${pr.normalized.toFixed(2)})</span></span>
    </div>`;
  }).join("");
  $("#bankparams").innerHTML = `<div style="font-weight:600;margin:2px 0 6px">[${p.index}] ${p.name}</div>${rows}`;
  $("#banksel").value = idx;
}

// --- piano MIDI 36..72 ---
const WHITE = [0,2,4,5,7,9,11];
function buildPiano() {
  const el = $("#piano"); el.innerHTML=""; let wx=0, wi=0;
  const black=[];
  for (let midi=36; midi<=72; midi++) {
    if (WHITE.includes(midi%12)) { el.appendChild(mkKey(midi,"w",wx)); wx+=27; wi++; }
    else black.push([midi, wi]);
  }
  for (const [midi, idx] of black) el.appendChild(mkKey(midi,"b", idx*27 - 8));
  el.style.width = wx + "px";
}
function mkKey(midi, cls, left) {
  const k = document.createElement("div"); k.className="key "+cls; k.style.left=left+"px";
  const dn = e => { e.preventDefault(); k.classList.add("dn"); note(midi,true); };
  const up = () => { if(k.classList.contains("dn")){ k.classList.remove("dn"); note(midi,false);} };
  k.addEventListener("mousedown",dn); k.addEventListener("mouseup",up); k.addEventListener("mouseleave",up);
  return k;
}
// Press a key -> note-on (allocates a voice); release -> note-off (that voice
// enters ADSR release). Holding several keys sounds a real polyphonic chord (up
// to 8 voices) through the ported driver. Pitch is the faithful state[304]=note/12
// (concert A440); timbre is the applied bit-exact coefficients; the full master
// path (8-voice mix + stereo BBD chorus mode II + output stage) plays live.
function note(midi, on) {
  ensureAudio();
  if (on) noteOnFn(ctx, midi, 100); else noteOffFn(ctx, midi);
  if (on) status(`note ${midi} — live 8-voice master path + stereo BBD chorus (mode II)`);
}

boot().catch(e => { status("ERROR: "+e); $("#warn").textContent = e; console.error(e); });
</script>
