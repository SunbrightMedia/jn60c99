; PlatformIO project for the JUNO-60 C99 port on a Teensy 4.1.
; See teensy/README.md. Build:  cd teensy && pio run -t upload && pio device monitor
[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; 816 MHz is a stock Teensyduino clock option, not an overclock hack. It is the
; single biggest lever available: 1.7x the Daisy's 480 MHz. Drop to 600 MHz (the
; default) if the board is unstable or runs hot, and re-read the DWT numbers --
; the firmware reports the budget from F_CPU_ACTUAL, so it stays honest either way.
board_build.f_cpu = 816000000L

; -ffp-contract=off is LOAD-BEARING. The reference is x86 SSE2, which has no FMA;
; FPv5 does, and without this flag the compiler fuses a*b+c into one
; single-rounding instruction and silently diverges. Same reason the host
; Makefile sets it. tests/test_fma_canary.c fails loudly if it ever slips.
build_flags =
    -std=gnu99
    -O2
    -ffp-contract=off
    -fno-strict-aliasing
    -I../src
    -I../gui
    -I../tests
    -Dmain=juno_golden_main          ; test_teensy_golden.c's main -> callable
    -Wl,--wrap=calloc                ; route the 12 MB state into PSRAM
    -Wl,--wrap=free

build_src_filter =
    +<*>
    +<../../src/*.c>
    +<../../gui/juno_bridge.c>
    +<../../tests/test_teensy_golden.c>
