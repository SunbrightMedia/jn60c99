<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>jn60c99 — JUNO-60 C99 (in-browser)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #1a1c20; color: #ddd; }
  header { position: sticky; top: 0; background: #23262c; border-bottom: 1px solid #333;
           padding: 8px 12px; z-index: 10; }
  h1 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select, input[type=text], input[type=number] {
    background: #2c2f36; color: #ddd; border: 1px solid #444; border-radius: 4px;
    padding: 4px 8px; font: inherit; }
  button { cursor: pointer; } button:hover { background: #363a42; }
  button.on { background: #3a5; border-color: #4c7; color: #fff; }
  .warn { color: #e88; font-size: 12px; margin-top: 4px; }   /* real errors only */
  .info { color: #9ad39a; font-size: 12px; margin-top: 4px; }  /* status / it-works */
  .caveat { color: #7d8894; font-size: 11px; margin-top: 3px; line-height: 1.4; }
  .note { color: #888; font-size: 11px; font-weight: 400; }
  main { padding: 10px 12px 80px; }
  .sec { margin: 14px 0 4px; font-weight: 600; color: #9cf; border-bottom: 1px solid #333;
         padding-bottom: 2px; }
  .p { display: grid; grid-template-columns: 210px 1fr 62px; gap: 10px;
       align-items: center; padding: 3px 0; }
  .p label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p input[type=range] { width: 100%; }
  .p input[type=number] { width: 58px; text-align: right; }
  .p button.sw { min-width: 52px; }
  .p.inert { opacity: .5; }                       /* recall-only: edits load but stay audio-inert here */
  .p.inert input[type=range] { filter: grayscale(1); }
  .tag { font-size: 9px; color: #b98; border: 1px solid #634; border-radius: 3px;
         padding: 0 4px; margin-left: 6px; vertical-align: 1px; text-transform: uppercase; }
  #piano { position: relative; height: 90px; user-select: none; margin: 6px 0; }
  .key { position: absolute; bottom: 0; border: 1px solid #111; border-radius: 0 0 4px 4px; }
  .key.w { width: 26px; height: 90px; background: #eee; z-index: 1; }
  .key.b { width: 16px; height: 56px; background: #222; z-index: 2; }
  .key.w.dn { background: #9cf; } .key.b.dn { background: #47a; }
  #status { position: fixed; bottom: 0; left: 0; right: 0; background: #23262c;
            border-top: 1px solid #333; padding: 5px 12px; font-size: 12px; color: #9a9; }
</style>

<header>
  <h1>jn60c99 — JUNO-60 C99 <span class=note id="meta">· loading WebAssembly…</span></h1>
  <div class="row">
    <select id="presets" title="saved patches (this browser)"></select>
    <button onclick="loadPreset()">Load</button>
    <button onclick="savePreset()">Save…</button>
    <button onclick="exportPreset()" title="download current patch as .json">Export</button>
    <button onclick="document.getElementById('imp').click()">Import</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importPreset(this)">
    <span style="width:12px"></span>
    <button onclick="render()" title="play a middle-C note of the current patch (dry voice path)">▶ Audition (C4)</button>
    <span style="width:12px"></span>
    <button onclick="document.getElementById('bankfile').click()" title="load a KoaBankFile00003 / PG-JU60 bank">Load bank (.bin)…</button>
    <input type="file" id="bankfile" accept=".bin" style="display:none" onchange="loadBank(this)">
  </div>
  <div id="piano"></div>
  <div class="row" id="arpbar" style="align-items:center;gap:8px">
    <b>Arp</b>
    <button id="arpToggle" onclick="arpToggle()" title="hold keys/chords to arpeggiate them">Off</button>
    <label>Mode
      <select id="arpMode" onchange="arpApply()">
        <option value="0">Up</option><option value="1">Down</option><option value="2">Up&amp;Down</option>
      </select></label>
    <label>Octaves
      <select id="arpOct" onchange="arpApply()"><option>1</option><option>2</option><option>3</option></select></label>
    <label>Tempo
      <input type="range" id="arpRate" min="40" max="260" step="1" value="120" oninput="arpApply()" style="vertical-align:middle">
      <span id="arpRateV">120 BPM</span></label>
    <label>Gate
      <input type="range" id="arpGate" min="0" max="1" step="0.05" value="0.6" oninput="arpApply()" style="vertical-align:middle">
      <span id="arpGateV">60%</span></label>
    <span style="width:12px"></span>
    <label title="SYSTEM 'Keyboard Velocity SW' — OFF (plugin default): every note plays at fixed velocity 100, exactly like the real plugin's wrapper (and the velocity-insensitive JUNO-60). ON: keys/MIDI use their real velocity.">Kbd&nbsp;Vel
      <input type="checkbox" id="velSw" onchange="velSwApply()"></label>
    <label id="velLbl" title="Note-on velocity for the on-screen keys (only when Kbd Vel is ON; VCF/VCA VELOCITY SENS respond to it)" style="opacity:.45">Vel
      <input type="range" id="vel" min="1" max="127" step="1" value="100" disabled oninput="document.getElementById('velV').textContent=this.value" style="vertical-align:middle">
      <span id="velV">100</span></label>
  </div>
  <div class="row">
    <input type="text" id="filter" placeholder="filter parameters…" oninput="renderList()" style="flex:1">
  </div>
  <div class="warn" id="warn"></div>
</header>

<dialog id="bankdlg" style="width:min(760px,92vw);max-height:82vh;background:#22252b;color:#ddd;border:1px solid #444;border-radius:8px;padding:0">
  <div style="position:sticky;top:0;background:#262a31;padding:8px 12px;border-bottom:1px solid #383c44;display:flex;gap:8px;align-items:center">
    <b id="bankttl">Bank</b>
    <select id="banksel" style="flex:1"></select>
    <button class="on" onclick="applyBankPatch()" title="load this patch's bit-exact coefficient subset into the engine">Apply to engine ▶</button>
    <button onclick="document.getElementById('bankdlg').close()">Close</button>
  </div>
  <div style="padding:6px 12px 4px" id="bankwarn"></div>
  <div id="bankparams" style="padding:4px 12px 14px"></div>
</dialog>

<main id="list"></main>
<div id="status">initialising…</div>

<script type="module">
import { decodeBank } from "./bank.js";

/* TextDecoder hardening: emscripten can back the WASM heap with a RESIZABLE
 * ArrayBuffer (via the wasm memory's resizable-buffer accessor) in browsers that
 * support it, and some browsers' TextDecoder then throws "provided ArrayBuffer
 * value must not be resizable" on any heap view — killing boot on the first C
 * string >16 bytes (param names). The engine is built with
 * -sGROWABLE_ARRAYBUFFERS=0 so this path is off at the toolchain level; this shim
 * is the defense-in-depth: copy any view over a resizable/growable buffer into a
 * fresh fixed buffer before decoding. */
{
  const _decode = TextDecoder.prototype.decode;
  const shimmed = function (input, opts) {
    if (input && ArrayBuffer.isView(input) &&
        (input.buffer.resizable === true || input.buffer.growable === true))
      input = input.slice();           // copy -> non-resizable backing buffer
    return _decode.call(this, input, opts);
  };
  shimmed.__junoRabShim = true;        // presence marker asserted by verify_webapp.mjs
  TextDecoder.prototype.decode = shimmed;
}

/* Cache-buster: build.sh rewrites this to the WASM content hash each build, so a new
 * engine is always fetched fresh instead of served from the browser/CDN cache. */
const BUILD_VER = "b818601db298";

// The plugin runs its DSP natively at the host sample rate (no oversampling, no
// decimator). SR is replaced at boot with the AudioContext's ACTUAL rate so the
// engine is built for exactly that rate and plays 1:1 — no resampler, no aliasing.
let SR = 96000;
const $ = s => document.querySelector(s);
const status = m => $("#status").textContent = m;

// The panel exposes ALL 79 host-visible parameters (the set a VST3 host such as
// Ableton exposes), enumerated from the engine itself (juno_gui_host_count /
// _name / _section / _max — the Script.xml value-tree leaves in src/juno_hostparams.c)
// and grouped into the console's sections. Editing a slider writes the parameter's
// byte into the loaded patch's record with the plugin's own leaf serialization and
// re-runs the EXACT recall (juno_gui_host_set), so what you hear is the plugin's own
// value-tree recall for that value.
const SECTION_LABEL = {
  DCO:"DCO — Oscillator", HPF:"HPF — High-Pass Filter", VCF:"VCF — Filter",
  VCA:"VCA — Amplifier", ENV1:"ENV-1 — Filter Envelope", ENV2:"ENV-2 — Amp Envelope",
  LFO:"LFO", BEND:"Bender", MOD:"Modulation (wheel depth)", GLOBAL:"Global / Performance",
  ARP:"Arpeggiator", EFFECT:"Effect (Chorus I/II · Flanger)", DELAY:"Delay",
  CHORUS:"Chorus", REVERB:"Reverb"
};
const SECTION_ORDER = ["DCO","HPF","VCF","VCA","ENV1","ENV2","LFO","BEND","MOD",
                       "GLOBAL","ARP","EFFECT","DELAY","CHORUS","REVERB"];
const SECTION_PREFIX = { DCO:"DCO", HPF:"HPF", VCF:"VCF", VCA:"VCA", ENV1:"ENV1",
  ENV2:"ENV2", LFO:"LFO", BEND:"BEND", MOD:"MOD", ARP:"ARPEGGIO", EFFECT:"EFFECT",
  DELAY:"DELAY", CHORUS:"CHORUS", REVERB:"REVERB" };
// Params that do NOT audibly change this port's output on a plain held note —
// measured empirically by scratchpad/probe_liveness.py driving the PORT's own render
// (libjuno.so, no capture) across all 64 factory patches. They fall into: redundant
// high-res mirrors the port derives from the coarse control (VCF/LFO …H); modulation
// depths that need a bend/mod wheel this webapp has no control for (BEND/MOD sens,
// flanger); and fine delay/chorus/reverb voicing + master tune/octave that the port
// recalls as aggregate FX coefficients rather than reading the individual byte. They
// are still shown and editable (the edit loads into the patch record), just marked so
// a silent slider doesn't read as broken.
const INERT = new Set([
  "VCF CUTOFF FREQ H","LFO RATE H","BEND RANGE","BEND GAIN","BEND SENS DCO",
  "BEND SENS VCF","MOD SENS DCO","MOD SENS VCF","MASTER TUNE","OCTAVE SHIFT",
  "KEY HOLD","FLANGER MANUAL","FLANGER RESONANCE","FLANGER LOW CUT","DELAY TAP TIME",
  "DELAY HIGH CUT","DELAY LF DAMP","DELAY LF DAMP FREQ","DELAY HF DAMP",
  "DELAY HF DAMP FREQ","CHORUS PRE DELAY","CHORUS LOW CUT","CHORUS HIGH CUT",
  "REVERB PRE DELAY","REVERB LOW CUT","REVERB HIGH CUT","REVERB DENSITY",
  "REVERB DIRECT LEVEL"]);
const ACRONYM = { Pwm: "PWM", Vcf: "VCF", Vca: "VCA", Dco: "DCO", Hpf: "HPF", Lfo: "LFO",
  Env: "ENV", Adsr: "ADSR", Lf: "LF", Hf: "HF", Vel: "Vel" };
const titleCase = s => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase())
  .replace(/\b(Pwm|Vcf|Vca|Dco|Hpf|Lfo|Lf|Hf)\b/g, m => ACRONYM[m]);
function prettify(name, sec) {
  const pfx = SECTION_PREFIX[sec];
  let s = name;
  if (pfx && (s === pfx || s.startsWith(pfx + " "))) s = s.slice(pfx.length).trim();
  return titleCase(s || name);
}

let M, ctx, get, set, chorusFn, gateFn, renderFn, malloc, free;
let noteOnFn, noteOffFn, midiNoteOnFn, midiNoteOffFn, velSwFn, applyBankFn, renderDryFn, arpFn, getArpFn, warmupFn, tempoFn;
let hostCountFn, hostNameFn, hostSectionFn, hostMinFn, hostMaxFn, hostGetFn, hostSetFn;
let arpOn = false;
let PARAMS = [];

async function boot() {
  status("loading engine (build " + BUILD_VER + ")…");
  const { default: JunoModule } = await import("./juno.js?v=" + BUILD_VER);
  M = await JunoModule({ locateFile: (path) => path.endsWith(".wasm") ? path + "?v=" + BUILD_VER : path });
  get = M.cwrap("juno_gui_get","number",["number","number"]);
  set = M.cwrap("juno_gui_set",null,["number","number","number"]);
  chorusFn = M.cwrap("juno_gui_set_chorus_mode",null,["number","number"]);
  hostCountFn   = M.cwrap("juno_gui_host_count","number",[]);
  hostNameFn    = M.cwrap("juno_gui_host_name","string",["number"]);
  hostSectionFn = M.cwrap("juno_gui_host_section","string",["number"]);
  hostMinFn     = M.cwrap("juno_gui_host_min","number",["number"]);
  hostMaxFn     = M.cwrap("juno_gui_host_max","number",["number"]);
  hostGetFn     = M.cwrap("juno_gui_host_get","number",["number","number"]);
  hostSetFn     = M.cwrap("juno_gui_host_set",null,["number","number","number"]);
  gateFn = M.cwrap("juno_gui_gate",null,["number","number"]);
  renderFn = M.cwrap("juno_gui_render","number",["number","number","number"]);
  renderDryFn = M.cwrap("juno_gui_render_dry","number",["number","number","number"]);
  noteOnFn = M.cwrap("juno_gui_note_on",null,["number","number","number"]);
  noteOffFn = M.cwrap("juno_gui_note_off",null,["number","number"]);
  midiNoteOnFn = M.cwrap("juno_gui_midi_note_on",null,["number","number","number"]);
  midiNoteOffFn = M.cwrap("juno_gui_midi_note_off",null,["number","number"]);
  velSwFn = M.cwrap("juno_gui_set_kbd_velocity",null,["number","number"]);
  arpFn = M.cwrap("juno_gui_arp_config",null,["number","number","number","number","number","number"]);
  tempoFn = M.cwrap("juno_gui_set_tempo",null,["number","number"]);
  getArpFn = M.cwrap("juno_gui_get_arp","number",["number"]);
  applyBankFn = M.cwrap("juno_gui_apply_bank","number",["number","number","number","number"]);
  warmupFn = M.cwrap("juno_gui_warmup",null,["number","number"]);
  malloc = M._malloc; free = M._free;
  // Create the AudioContext at the device's native rate (usually 48 kHz) and build
  // the engine for EXACTLY that rate. juno_gui_create writes state[16]=rate, and the
  // rate-parameterized prepare + recall reproduce the plugin's own per-rate
  // coefficients — so there is nothing to resample. Construction is allowed before a
  // user gesture (the context starts suspended; we resume it on first play).
  try {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.sampleRate > 0) SR = audioCtx.sampleRate | 0;
  } catch (e) { console.warn("JUNO: AudioContext unavailable at boot; defaulting engine to", SR, "Hz", e); }
  ctx = M.cwrap("juno_gui_create","number",["number","number"])(SR, 0);  // engine at host rate.
  // chorus_mode MUST be 0: any nonzero mode writes a LEGACY hand-rolled chorus
  // block (state 90624..90832) that the real plugin NEVER populates (proven by
  // executing the plugin cold/warm/recalled/rendered — the block stays zero).
  // Every proven gate runs mode 0; the webapp passing 2 was the one caller of an
  // unproven path, smearing a non-plugin chorus over every chorus-engaged patch.
  if (!ctx) { status("engine alloc failed"); return; }
  // Warm the engine to its steady idle state, exactly as a DAW does by rendering
  // silence from the moment the plugin is activated. ~190 smoothed control cells
  // start at 0 and only converge toward their targets WHILE rendering; a freshly
  // created engine plays its FIRST note with an audible ~1-2 s swell (the filter
  // slowly opening) until they settle. A DAW never shows this because the host has
  // always been rendering before you play. Measured: the first-note trajectory is
  // fully converged (bit-stable) after ~1 s of warmup, so warm 1.5 s at the host
  // rate. This is a one-time boot cost; later patch changes keep the warmed cells.
  warmupFn(ctx, (SR * 3) >> 1);

  PARAMS = buildParams();

  $("#meta").textContent = `· ${PARAMS.length} host parameters @ ${SR} Hz · build ${BUILD_VER} · runs entirely in your browser`;
  $("#warn").innerHTML =
    `<div class="info">✓ Ready — <b>Load bank → Apply → press a key</b>, then tweak the sliders below. The panel exposes <b>all ${PARAMS.length} host-visible parameters</b> (the same set a VST3 host such as Ableton exposes), grouped by section — DCO, HPF, VCF, VCA, both envelopes, LFO, bender/mod, global, arp and the chorus/flanger/delay/reverb effects — enumerated straight from the plugin's <b>Script.xml value tree</b>. Moving a slider writes that parameter's byte into the loaded patch's record with the plugin's own serialization and re-runs the <b>exact bit-exact recall</b>, so you hear the plugin's own value-tree recall for that value across the full 8-voice + chorus + output path.</div>` +
    `<div class="caveat">Each slider shows the <b>value the engine recalled</b> for the loaded patch (read back through the engine's own per-leaf decode). Editing re-runs the full recall (a held note keeps ringing, reseeded with the new coefficients — so it behaves like a patch edit, not a smooth mid-note knob). Sliders tagged <span class="tag">recall-only</span> load into the patch but produce <b>no audible change on a plain held note in this port</b>: they are either redundant high-res mirrors the port derives from the coarse control, modulation depths that need a bend/mod wheel this page has no control for, or fine delay/chorus/reverb voicing the port recalls as an aggregate coefficient. The <b>arpeggiator</b> (row above) auto-recalls per preset; Tempo/Gate stay local because the plugin's arp is host-tempo-synced.</div>`;
  buildPiano();
  refreshPresets();
  renderList();
  status("ready — running in-browser (no server)");
}

// Enumerate all 79 host-visible parameters from the engine, grouped into the
// console's sections in front-panel order. Each carries its value ceiling (127 for
// 7-bit leaves, else 255) and an `inert` flag (no audible change in this port; see
// INERT above).
function buildParams() {
  const n = hostCountFn(), list = [];
  for (let i = 0; i < n; i++) {
    const name = hostNameFn(i) || ("param " + i);
    const sec = hostSectionFn(i) || "GLOBAL";
    const min = hostMinFn(i);                 // semantic Script.xml range: enums get
    const max = hostMaxFn(i) || 255;          // their true step count, OCTAVE SHIFT
    const sord = SECTION_ORDER.indexOf(sec);  // is signed -3..3, knobs stay 0..255
    list.push({ idx: i, name, section: sec, secLabel: SECTION_LABEL[sec] || sec,
                label: prettify(name, sec), min, max, val: 0,
                inert: INERT.has(name), sord: sord < 0 ? 99 : sord });
  }
  list.sort((a, b) => a.sord - b.sord || a.idx - b.idx);
  return list;
}

function renderList() {
  const f = $("#filter").value.toLowerCase();
  const el = $("#list"); el.innerHTML = ""; let sec = null;
  for (const p of PARAMS) {
    if (f && !p.name.toLowerCase().includes(f) && !p.label.toLowerCase().includes(f) && !p.secLabel.toLowerCase().includes(f)) continue;
    if (p.secLabel !== sec) { sec = p.secLabel; const h = document.createElement("div"); h.className="sec"; h.textContent=sec; el.appendChild(h); }
    el.appendChild(rowFor(p));
  }
}

function rowFor(p) {
  const d = document.createElement("div"); d.className = "p" + (p.inert ? " inert" : "");
  const lab = document.createElement("label");
  lab.title = p.name + (p.inert ? "  — recall-only / modulation-dependent: no audible change on a held note in this port" : "");
  lab.textContent = p.label;
  if (p.inert) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "recall-only"; lab.appendChild(t); }
  const mid = document.createElement("div");
  const num = document.createElement("input");
  num.type="number"; num.min=p.min; num.max=p.max; num.step=1; num.value=p.val;
  const r = document.createElement("input"); r.type="range";
  r.min=p.min; r.max=p.max; r.step=1; r.value=p.val;
  r.oninput  = () => num.value = r.value;
  r.onchange = () => { commit(p, +r.value); num.value=p.val; r.value=p.val; };
  num.onchange = () => { commit(p, +num.value); r.value=p.val; num.value=p.val; };
  mid.appendChild(r); p._range = r; p._num = num;
  d.append(lab, mid, num); return d;
}

// Write value v into the loaded patch's record for this param and re-run the exact
// plugin recall (juno_gui_host_set; flush=0 so a held note keeps ringing). Reads the
// value back so the model reflects the byte the engine actually stored.
function commit(p, v) {
  if (!ctx) return;
  v = Math.max(p.min, Math.min(p.max, Math.round(v) || 0));
  if (!BANK_RAW) { status(`${p.label}: load a bank first — edits apply to the loaded patch`); return; }
  hostSetFn(ctx, p.idx, v);
  // The edit's re-recall re-bakes tempo-synced delay cells at the plugin's
  // 128-BPM default — re-push the host tempo so echoes stay on the arp grid.
  tempoFn(ctx, +$("#arpRate").value);
  // Read back through the engine's own decode (signed leaves like OCTAVE SHIFT
  // return negatives, so a negative readback is a VALUE here, not an error —
  // with a bank loaded the decode cannot fail).
  p.val = hostGetFn(ctx, p.idx);
  status(`${p.label} (${p.section}) = ${p.val}${p.inert ? " · recall-only (no audible change here)" : ""}`);
}

// --- controls (exposed for inline handlers) ---
window.renderList = renderList;
window.arpApply = () => {
  const mode=+$("#arpMode").value, oct=+$("#arpOct").value,
        bpm=+$("#arpRate").value, gate=+$("#arpGate").value;
  $("#arpRateV").textContent = bpm+" BPM";
  $("#arpGateV").textContent = Math.round(gate*100)+"%";
  if (arpFn) arpFn(ctx, arpOn?1:0, mode, oct, bpm, gate);
  if (arpOn) status(`arp on — hold keys/chords to arpeggiate (${["up","down","up&down"][mode]}, ${oct} oct, ${bpm} BPM, eighth-notes)`);
};
window.arpToggle = () => {
  arpOn = !arpOn;
  const b=$("#arpToggle"); b.textContent = arpOn?"On":"Off"; b.classList.toggle("on", arpOn);
  if (arpOn) ensureAudio();
  arpApply();
};

// --- presets: localStorage + file export/import ---
const KEY = "jn60c99.presets";
const store = () => JSON.parse(localStorage.getItem(KEY) || "{}");
function refreshPresets() {
  const s = $("#presets"), names = Object.keys(store()).sort();
  s.innerHTML = names.map(n=>`<option>${n}</option>`).join("") || "<option disabled>(no saved patches)</option>";
}
// Presets snapshot the host-parameter values, keyed by parameter name (a stable id
// that survives rebuilds).
function snapshot() { const o={}; for (const p of PARAMS) o[p.name]=p.val; return o; }
function apply(o) {
  for (const p of PARAMS) if (p.name in o) commit(p, +o[p.name]);
  renderList();
}
window.savePreset = () => { const n=prompt("Patch name:"); if(!n) return; const all=store(); all[n]=snapshot(); localStorage.setItem(KEY, JSON.stringify(all)); refreshPresets(); $("#presets").value=n; status("saved "+n); };
window.loadPreset = () => { const n=$("#presets").value, all=store(); if(!all[n]) return; apply(all[n]); status("loaded "+n); };
window.exportPreset = () => { const blob=new Blob([JSON.stringify(snapshot(),null,0)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="patch.json"; a.click(); status("exported patch.json"); };
window.importPreset = (inp) => { const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ apply(JSON.parse(rd.result)); status("imported "+f.name);}catch(e){status("import failed: "+e);} }; rd.readAsText(f); inp.value=""; };

// --- render + play via Web Audio (no server), REAL-TIME + POLYPHONIC ---
// A ScriptProcessor renders the full 8-voice master path continuously; key
// presses drive per-voice note-on/off through the ported gate/ADSR driver and
// the 8-voice allocator (juno_bridge.c), so held chords sound with real voices.
let audioCtx, procNode, rbuf = 0, rcap = 0;
const BLK = 1024;
function ensureAudio() {
  // audioCtx was created at boot at the device's native rate, and the engine was
  // built for exactly that rate — so the engine renders directly at the output rate,
  // 1:1, with NO resampler. (This is what the plugin does: it runs its DSP natively
  // at the host rate; there is no decimation stage to reproduce.)
  if (!audioCtx) {                              // fallback if boot couldn't create one
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  audioCtx.resume();
  if (procNode) return;                         // audio graph already installed
  rbuf = malloc(BLK * 2 * 4); rcap = BLK;       // one output block of interleaved stereo
  const clamp1 = (x) => x > 1 ? 1 : x < -1 ? -1 : x;
  procNode = audioCtx.createScriptProcessor(BLK, 0, 2);
  procNode.onaudioprocess = (e) => {
    const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
    const n = L.length;                         // == BLK, at the engine's own rate
    renderFn(ctx, rbuf, n);
    const s = new Float32Array(M.HEAPF32.buffer, rbuf, n * 2);
    for (let i = 0; i < n; i++) { L[i] = clamp1(s[2*i]); R[i] = clamp1(s[2*i+1]); }
  };
  procNode.connect(audioCtx.destination);
}
// "Audition" = play a middle-C (C4) for ~0.6s (note-on then note-off).
window.render = () => { note(60, true); setTimeout(() => note(60, false), 600); };

// --- bank browser (.bin) ---
let BANK = null, BANK_RAW = null;
window.loadBank = (inp) => {
  const f = inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      BANK = decodeBank(rd.result);                   // validates magic/size — throws on junk
      BANK_RAW = new Uint8Array(rd.result);           // retained ONLY after validation, so a
      showBank();                                     // malformed file never reaches the C applier
      status(`bank loaded: ${BANK.patch_count} patches`);
    }
    catch (e) { status("bank error: " + e.message); alert("Could not read bank:\n" + e.message); }
  };
  rd.readAsArrayBuffer(f); inp.value = "";
};

// Apply the selected patch's full bit-exact recall into the live engine, then snap
// every front-panel slider to that patch's own 0..255 bytes.
window.applyBankPatch = () => {
  if (!BANK_RAW) return;
  applyPatchIndex(+$("#banksel").value);
  $("#bankdlg").close();
};

// Recall patch `idx` and reflect it in the panel. Shared by the dialog's Apply
// button and the embedded-bank auto-load (bundled artifact).
function applyPatchIndex(idx) {
  const ptr = malloc(BANK_RAW.length);
  M.HEAPU8.set(BANK_RAW, ptr);
  const n = applyBankFn(ctx, ptr, BANK_RAW.length, idx);
  free(ptr);
  reflectFromRecord(idx);   // sliders <- the patch's recalled bytes
  syncArpUI();              // arp toggle/mode/octave <- per-patch arp recall
  // The webapp IS the host: a DAW pushes its transport tempo to the plugin every
  // block, and the plugin re-times the tempo-synced DELAY (cell 102352) and LFO
  // (cell 1072) from it. The recall bakes those cells at the plugin's 128-BPM
  // recall default while the arp clock runs at the Tempo slider (120 default) —
  // without this push, tempo-synced echoes land 128/120 = 6.7% off the arp's
  // step grid (audibly "off-time" on delay-heavy arp presets) and synced LFOs
  // idle at the prepare default. juno_gui_set_tempo re-times ONLY the tempo
  // domain (no arp pattern/selector side effects) and is patch-gated inert for
  // presets whose sync flags are off.
  tempoFn(ctx, +$("#arpRate").value);
  status(`applied patch ${idx} "${BANK.patches[idx].name}" — ${n} bit-exact coefficients loaded${arpOn?" · arp ON":""} (press a key to hear it)`);
}

// Snap every slider to the loaded patch's own value, read back through the engine
// (juno_gui_host_get decodes the retained patch record with the plugin's per-leaf
// decode) — so each slider shows exactly what the engine recalled.
function reflectFromRecord(idx) {
  // Called only after a successful apply (bank retained), so decode cannot fail;
  // negative values are genuine (signed leaves, e.g. OCTAVE SHIFT -3..3).
  for (const p of PARAMS) p.val = hostGetFn(ctx, p.idx);
  renderList();
}

function syncArpUI() {
  if (!getArpFn) return;
  const a = getArpFn(ctx);
  arpOn = !!(a & 1);
  $("#arpMode").value = String((a >> 1) & 3);
  $("#arpOct").value  = String(((a >> 3) & 3) + 1);
  const b = $("#arpToggle"); b.textContent = arpOn ? "On" : "Off"; b.classList.toggle("on", arpOn);
}
window.applyPatchIndex = applyPatchIndex;   // used by the embedded-bank auto-load
function showBank() {
  const sel = $("#banksel");
  sel.innerHTML = BANK.patches.map(p => `<option value="${p.index}">${String(p.index).padStart(2,"0")}  ${p.name}</option>`).join("");
  sel.onchange = () => showPatch(+sel.value);
  $("#bankttl").textContent = `${BANK.model} bank`;
  $("#bankwarn").innerHTML =
    `<div class="info"><b>Apply to engine</b> loads the patch's full front-panel + extended recall as <b>bit-exact coefficients</b> — the parameter set the plugin's OWN recall enumerator fires, each value proven against the plugin's own setter under emulation (recall_gate.py: 67/67 voice cells, all 64 patches): DCO range · PWM depth·level·source · saw·sub·noise level · LFO mod, VCF cutoff · resonance · HPF cutoff+type · env-mod · key-follow · LFO mod, both ADSR envelopes, VCA tone · level · mode, LFO delay · rate · key-trig · tempo-sync · env-trig, portamento · bend range, and per-patch delay · reverb · arpeggiator.</div>` +
    `<div class="caveat">Voice recall is proven bit-exact against the plugin's own recall. The remaining JUNO panel controls are <b>not per-patch DSP coefficients</b>: bend / mod-wheel sensitivity (inert unless you move those controls), note-assign modes (mono / legato — this preview plays polyphonic), and the JU-06A-only controls the JUNO-60 disables (2nd oscillator, ring, sync). FX (chorus / delay / reverb / effect modes) render bit-exact for most patches, with <b>known open items</b> — delay feedback on zero-feedback patches and two effect-tail cases — tracked honestly in PROVENANCE.tsv.</div>`;
  showPatch(0);
  $("#bankdlg").showModal();
}
function showPatch(idx) {
  const p = BANK.patches[idx];
  const rows = p.params.map(pr => {
    const bar = Math.round(pr.normalized * 100);
    const dim = pr.confidence === "unconfirmed" ? "opacity:.55" : "";
    return `<div style="display:grid;grid-template-columns:210px 1fr 54px;gap:8px;align-items:center;padding:1px 0;${dim}">
      <span title="${pr.role}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pr.role}</span>
      <span style="background:#1a1c20;border-radius:3px;height:9px;position:relative"><span style="position:absolute;left:0;top:0;bottom:0;width:${bar}%;background:#4a7;border-radius:3px"></span></span>
      <span style="text-align:right;color:#9cf">${pr.raw} <span class=note>(${pr.normalized.toFixed(2)})</span></span>
    </div>`;
  }).join("");
  $("#bankparams").innerHTML = `<div style="font-weight:600;margin:2px 0 6px">[${p.index}] ${p.name}</div>${rows}`;
  $("#banksel").value = idx;
}

// --- piano MIDI 36..72 ---
const WHITE = [0,2,4,5,7,9,11];
function buildPiano() {
  const el = $("#piano"); el.innerHTML=""; let wx=0, wi=0;
  const black=[];
  for (let midi=36; midi<=72; midi++) {
    if (WHITE.includes(midi%12)) { el.appendChild(mkKey(midi,"w",wx)); wx+=27; wi++; }
    else black.push([midi, wi]);
  }
  for (const [midi, idx] of black) el.appendChild(mkKey(midi,"b", idx*27 - 8));
  el.style.width = wx + "px";
}
function mkKey(midi, cls, left) {
  const k = document.createElement("div"); k.className="key "+cls; k.style.left=left+"px";
  const dn = e => { e.preventDefault(); k.classList.add("dn"); note(midi,true); };
  const up = () => { if(k.classList.contains("dn")){ k.classList.remove("dn"); note(midi,false);} };
  k.addEventListener("mousedown",dn); k.addEventListener("mouseup",up); k.addEventListener("mouseleave",up);
  return k;
}
// Press a key -> note-on (allocates a voice); release -> note-off (that voice
// enters ADSR release). Holding several keys sounds a real polyphonic chord (up
// to 8 voices) through the ported driver. Pitch is the faithful state[304]=note/12
// (concert A440); timbre is the applied bit-exact coefficients; the full master
// path (8-voice mix + stereo BBD chorus mode II + output stage) plays live.
function note(midi, on) {
  ensureAudio();
  // Notes enter through the WRAPPER-level MIDI path (juno_gui_midi_note_on),
  // exactly like a DAW's events enter the real plugin: with the SYSTEM
  // "Keyboard Velocity SW" OFF (the default) the engine receives velocity 100
  // no matter what the slider says — the plugin's own rule (see juno_bridge.c).
  const vel = +$("#vel").value;   // 1..127; only honored when Kbd Vel SW is ON
  if (on) midiNoteOnFn(ctx, midi, vel); else midiNoteOffFn(ctx, midi);
  if (on) status(`note ${midi} · vel ${$("#velSw").checked ? vel : "100 (fixed — Kbd Vel SW off, plugin default)"} — live 8-voice master path`);
}

// SYSTEM "Keyboard Velocity SW" toggle: mirrors the plugin's wrapper flag.
function velSwApply() {
  const on = $("#velSw").checked;
  velSwFn(ctx, on ? 1 : 0);
  $("#vel").disabled = !on;
  $("#velLbl").style.opacity = on ? "1" : ".45";
  status(`Keyboard Velocity SW ${on ? "ON — real velocities" : "OFF — every note fixed at velocity 100 (the plugin's default behavior)"}`);
}

// --- Web MIDI: play the engine from a hardware keyboard. Uses ONLY the proven
// note path (the same noteOnFn/noteOffFn the on-screen keys call), with the
// device's real per-note velocity. No sysex requested; silently unavailable in
// browsers without Web MIDI (Safari/Firefox without flag) — the UI still works.
function initMIDI() {
  if (!navigator.requestMIDIAccess) return;
  navigator.requestMIDIAccess({ sysex: false }).then(acc => {
    const wire = inp => {
      inp.onmidimessage = ev => {
        const [st, d1, d2] = ev.data;
        const cmd = st & 0xF0;
        if (cmd === 0x90 && d2 > 0) {          // note on
          ensureAudio();
          midiNoteOnFn(ctx, d1, d2);           // wrapper path: vel forced to 100
          status(`MIDI ${inp.name}: note ${d1} · vel ${d2}`);   //  unless Kbd Vel SW on
        } else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) {
          midiNoteOffFn(ctx, d1);              // note off (or running-status vel 0)
        }
      };
    };
    for (const inp of acc.inputs.values()) wire(inp);
    acc.onstatechange = e => {                 // hot-plug support
      if (e.port.type === "input" && e.port.state === "connected") wire(e.port);
    };
    const n = [...acc.inputs.values()].map(i => i.name);
    if (n.length) status("MIDI connected: " + n.join(", ") + " — play your keyboard");
  }).catch(() => {});                          // permission denied: keep the on-screen keys
}

boot().then(initMIDI).catch(e => { status("ERROR: "+e); $("#warn").textContent = e; console.error(e); });
</script>
</html>
