<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUNO-60 C99 Port</title>
<link rel="icon" href="data:,">
<!-- The plugin's own GUI (its Script.xml and sprite sheets) on the C99 port.
     LOCAL ONLY: the sprite sheets are Roland's artwork from the user's plugin
     installation (truth/Script/). Never publish this page or its assets.
     Run from the repository root:  python3 -m http.server 8000
     then open http://localhost:8000/gui/skin/  (see README.md). -->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #111; color: #bbb; font: 13px/1.4 Arial, "Liberation Sans", sans-serif; }
  #wrap { padding: 12px 16px; }
  #panel { display: block; touch-action: none; user-select: none; max-width: none; }
  #status { margin: 8px 0 0; min-height: 1.4em; color: #999; }
  .menu { position: fixed; z-index: 10; background: #222; border: 1px solid #555; padding: 4px 0;
          min-width: 160px; box-shadow: 0 4px 16px rgba(0,0,0,.6); }
  .menu .mh { padding: 4px 12px 2px; color: #777; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .menu .mi { padding: 3px 18px; cursor: pointer; color: #ddd; }
  .menu .mi:hover { background: #3a3a3a; }
  .menu .mi.on { color: #fa183f; }
  #err { color: #f66; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="panel" width="1924" height="740"></canvas>
  <div id="status">loading…</div>
  <div id="err"></div>
</div>
<script type="module">
  import { boot } from "./skin.js";
  const st = s => { document.getElementById("status").textContent = s; };
  boot(document.getElementById("panel"), st).catch(e => {
    document.getElementById("err").textContent = String(e && e.stack || e);
    console.error(e);
  });
</script>
</body>
</html>
